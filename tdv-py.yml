# 1xxx — Missing documentation
#   10xx — Visibility-independent
#   11xx — Public
#   12xx — Protected
#   13xx — Private
#   14xx — Other visibility
#   15xx — Unknown visibility
#   16xx–18xx — Reserved
#   19xx — Experimental
# 2xxx — Parameters
#   20xx — Signature/documentation correspondence
#   21xx — Types and annotations
#   22xx — Parameter contract metadata
#   23xx — Description completeness
#   24xx–28xx — Reserved
#   29xx — Experimental
# 3xxx — Produced values
#   30xx — Return values
#   31xx — Yielded values
#   32xx — Generators combining return and yield
#   33xx–38xx — Reserved
#   39xx — Experimental
# 4xxx — Exceptions
#   40xx — Documented/exposed exception set
#   41xx — Exception contract content
#   42xx — BASE→HEAD exception contract changes
#   43xx–48xx — Reserved
#   49xx — Experimental
# 5xxx — Structured objects
#   50xx — Classes and constructors
#   51xx — Attributes and documented variables
