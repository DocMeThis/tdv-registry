# 10xx — Visibility-independent
TDV-PY-1000:
  name: undocumented-object
  definition: >
    An object that deserves documentation carries none at all.
  implementations:
    numpydoc:
      code: GL08
    pylint-docstrings:
      code: C0111
      mapping: aggregate
      note: historical code; superseded by specific undocumented-* rules

TDV-PY-1001:
  name: undocumented-module
  definition: >
    A module carries no docstring.
  implementations:
    pylint-docstrings:
      code: C0114
  related:
