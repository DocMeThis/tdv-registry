# TDV-PY — Python Taxonomy of Documentation Violations
# Canonical registry proposal.
#
# A TDV-PY rule defines a semantic diagnostic, not a detection algorithm.
# `related` expresses relationships between canonical TDV-PY rules; it does not prescribe
# emission, precedence, or de-duplication policy to implementations.
# `implementations` records known native/tool codes. `mapping` is used only when a
# tool code does not map straightforwardly to the canonical predicate; it takes a
# restricted enum value (`broader`, `narrower`, `overlap`, `aggregate`,
# `historical`, `policy-dependent`, `review-required`), optionally complemented
# by a free-form `note` field.
# `fixers` records known automatic correction paths (for example `ruff-check`,
# `ruff-format`, or `docmethis-fix`). Absence of `fixers` means no fixer is recorded.
#
# During the DocMeThis migration, implementation codes use
# `DMT-XXXX+(DMT-YYY)`: `XXXX` is aligned with the canonical TDV-PY code and
# `YYY` is the legacy DMT code. The `+(DMT-YYY)` suffix is transitional.

_meta:
  registry: TDV-PY
  language: Python
  version: 0.1.0

# ============================================================================
# 0xxx — Parsing and validation
# ============================================================================

# 00xx — Source and docstring parsing
TDV-PY-0001:
  name: unparseable-python-source
  definition: >
    The Python source file cannot be parsed, so its documentation cannot be
    analyzed reliably.
  implementations:
    docmethis:
      code: DMT-0001+(DMT-021)
      mapping: broader
    pydoclint:
      code: DOC002
    darglint:
      code: DAR000

TDV-PY-0002:
  name: unparseable-docstring
  definition: >
    The docstring cannot be parsed into a recognized structure, so its content
    cannot be validated.
  implementations:
    docmethis:
      code: DMT-0002+(DMT-450)
    pydoclint:
      code: DOC001
    darglint:
      code: DAR001

# 01xx — Docstyle identification and compatibility
TDV-PY-0101:
  name: docstyle-mismatch
  definition: >
    The documentation uses a style that differs from the style expected or
    configured for the project.
  implementations:
    docmethis:
      code: DMT-0101+(DMT-451)
    pydoclint:
      code: DOC003

TDV-PY-0102:
  name: aggregate-docstyle-nonconformity
  definition: >
    The documentation as a whole does not conform to the expected style, without a
    single precise violation being identifiable.
  implementations:
    docmethis:
      code: DMT-0102+(DMT-452)


